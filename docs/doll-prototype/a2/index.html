<title>ตู้เสื้อผ้าตุ๊กตา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: แถบบนเหรียญ (จำลอง) → เวทีตัวละคร → แท็บช่อง → ตารางชิ้น → ปุ่มล่าง · หน้าตาเลียนแบบ DollView.vue ในเว็บ */
:root{
  --bg:#f7f9fd; --surface:#ffffff; --ink:#2b3550; --muted:#6b7590; --line:#dde5f0;
  --primary:#3593cf; --primary-2:#62b6e6; --primary-light:#e6f2fb; --primary-dark:#1f6fa3; --gold:#b7791f;
  --pop:0 2px 8px rgba(43,53,80,.08);
  --f-disp:"Mitr",system-ui,sans-serif; --f-body:"Sarabun",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171f;--surface:#20232e;--ink:#e8ecf6;--muted:#a3abc0;--line:#323747;--primary-light:#1d3346;--primary-dark:#8ccaf2;--gold:#f2c76b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171f;--surface:#20232e;--ink:#e8ecf6;--muted:#a3abc0;--line:#323747;--primary-light:#1d3346;--primary-dark:#8ccaf2;--gold:#f2c76b;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{max-width:520px;margin:0 auto;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;min-height:100%}
.banner{font-size:.78rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1;margin:0;font-family:var(--f-disp);font-weight:600;font-size:1.2rem}
.coins{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.coins button{font:inherit;font-size:.72rem;margin-left:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 8px;cursor:pointer}
.stage{display:grid;justify-items:center;gap:4px;padding:14px 10px 10px;border-radius:22px;background:linear-gradient(160deg,#e3effb,#fff 60%,#fde2ee);border:1px solid var(--line);box-shadow:var(--pop)}
.note{font-size:.74rem;color:#6b7590;font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;font:inherit;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tab.cov:not(.on){opacity:.55}
.hint{margin:0;font-size:.76rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-bottom:8px}
.item{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink)}
.item.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(53,147,207,.18);background:var(--primary-light)}
.item canvas{background:#eef4fb;border-radius:8px}
.none{height:104px;display:grid;place-items:center;font-size:.82rem;font-weight:700;color:var(--muted)}
.nm{font-size:.74rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.price{font-size:.76rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.st{font-size:.72rem;font-weight:800;color:var(--muted)}
.st.on{color:var(--primary-dark)}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.color{font:inherit;height:56px;border-radius:14px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:4px}
.color.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(53,147,207,.22)}
.color span{font-size:.72rem;font-weight:700;background:rgba(255,255,255,.88);color:#2b3550;border-radius:999px;padding:0 6px}
.dock{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,var(--bg) 72%,transparent)}
.btn{flex:1;font:inherit;font-size:.92rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-2));border:0;border-radius:14px;padding:13px 10px;cursor:pointer;box-shadow:var(--pop)}
.btn.ghost{flex:0 0 auto;color:var(--primary-dark);background:var(--surface);border:1px solid var(--line)}
.btn:disabled{background:#cbd5e1;cursor:default}
.btn:focus-visible,.item:focus-visible,.tab:focus-visible,.color:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(20,24,36,.45);display:grid;place-items:end center;padding:16px;z-index:20}
.sheet[hidden]{display:none!important}
.sheet .card{background:var(--surface);border-radius:18px;padding:16px;max-width:480px;width:100%;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet p{margin:0;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3550;color:#fff;padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:30}
.toast[hidden]{display:none!important}
</style>

<div class="app">
  <div class="banner">หน้าจำลองบน artifact · ใช้โค้ดเรนเดอร์และตรรกะตู้เสื้อผ้าชุดเดียวกับเว็บจริง · เหรียญเป็นของปลอม ซื้อแล้วไม่มีผลกับบัญชีจริง</div>
  <div class="top"><h1>ตู้เสื้อผ้า</h1><span class="coins">🪙 <span id="coins"></span><button id="refill" type="button">เติมเหรียญปลอม</button></span></div>
  <div class="stage"><canvas id="main"></canvas><div class="note" id="note"></div></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="hint" id="hint" hidden>ชุดเต็มตัวที่ลองอยู่บังช่องนี้ · เลือกชิ้นในนี้ = ถอดชุดเต็มตัวออก</p>
  <div id="body"></div>
  <div class="dock" id="dock" hidden>
    <button class="btn ghost" id="reset" type="button">ย้อนกลับ</button>
    <button class="btn" id="act" type="button"></button>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="card"><p id="ask"></p><div style="display:flex;gap:8px"><button class="btn ghost" id="no" type="button">ยกเลิก</button><button class="btn" id="yes" type="button">ยืนยัน</button></div></div></div>
<div class="toast" id="toast" hidden></div>

// 🧍 RxTU10 doll — ตัวเรนเดอร์ (pure, ไม่แตะ DOM) ยกจาก docs/doll-prototype/doll.js 18 พ.ย. 2026
// compose(eq) → กริดสี 40x44 · outline(grid) → +ขอบเข้ม 1px + ขอบขาว 2px (กรอบ 48x52) · render(eq) = ทั้งสองขั้น
// ปรับจากต้นแบบ (user เลือกแบบ B 18 พ.ย.): ไหล่มน + เส้นแยกแขน/ลำตัวเมื่อสีเดียวกัน · แขนยาวอยู่ใน BASE (data/dollParts.js)

// ลำดับซ้อนจากหลังไปหน้า — ตัวฐาน (base) อยู่ก่อนเสื้อผ้าเสมอ ชุด/กระโปรงจึงทับมือที่ยาวขึ้นได้เอง
const ORDER = ['w', 'hb', 'base', 'b', 'k', 't', 'o', 'e', 'm', 'h', 'x', 'a', 'i']

const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16))
const mix = (a, b, t) =>
  '#' + hx(a).map((v, i) => Math.round(v + (hx(b)[i] - v) * t).toString(16).padStart(2, '0')).join('').toUpperCase()

function apply(g, ops, pal, mirror, onlyEmpty, off) {
  const [ox, oy] = off || [0, 0]
  const put = (x0, y0, ch, mir) => {
    const x = x0 + (mir ? -ox : ox), y = y0 + oy     // ฝั่งสะท้อนเลื่อน x กลับด้าน (ปีกซ้าย-ขวาเท่ากัน)
    if (ch === '.' || x < 0 || x >= W || y < 0 || y >= H) return
    if (onlyEmpty && g[y][x]) return
    g[y][x] = pal[ch] || ch
  }
  const one = (op, mir) => {
    if (op[0] === 'r') {
      const [, x, y, w, h, c] = op
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) put(mir ? W - 1 - (x + i) : x + i, y + j, c, mir)
    } else {
      const [, x, y, s] = op
      for (let i = 0; i < s.length; i++) put(mir ? W - 1 - (x + i) : x + i, y, s[i], mir)
    }
  }
  for (const op of ops || []) { one(op, false); if (mirror) one(op, true) }
}

// ช่องที่ถูกชิ้นอื่นกินอยู่ (ชุดเต็มตัว full → กิน b · ชิ้นใดก็ประกาศ covers ได้)
function hiddenSlots(eq) {
  const hidden = new Set()
  for (const k of ORDER) {
    const p = PART[eq[k]]
    if (!p) continue
    if (p.full) hidden.add('b')
    for (const c of p.covers || []) hidden.add(c)
  }
  return hidden
}

// ไหล่มน: ตัดมุมบนนอกสุดของไหล่ (แถว 18) ถ้าเหนือและข้างนอกว่าง = เป็นมุมจริง ไม่ใช่ปีก/ผม/ผ้าคลุม
function roundShoulders(g) {
  for (const [x, out] of [[12, 11], [W - 13, W - 12]]) {
    if (g[18][x] && !g[17][x] && !g[18][out]) g[18][x] = null
  }
}
// แยกแขนกับลำตัว: แขน (x=13) กับขอบลำตัว (x=14) สีเดียวกัน → ลงเงาบางที่ขอบลำตัว (เสื้อยืดขาว กาวน์ ฮู้ด)
function armSeam(g) {
  for (let y = 19; y <= 27; y++) {
    for (const [a, b] of [[13, 14], [W - 14, W - 15]]) {
      if (g[y][a] && g[y][a] === g[y][b]) g[y][b] = mix(g[y][b], INK, 0.28)
    }
  }
}

function compose(eq) {
  const g = Array.from({ length: H }, () => Array(W).fill(null))
  const skin = SKINS.find(s => s.id === eq.s) || SKINS[1]
  const hair = HAIRC.find(c => c.id === eq.c) || HAIRC[0]
  const glob = { S: skin.S, s: skin.s, H: hair.H, h: hair.h, L: hair.L, K: INK, W: '#FFFFFF', C: '#FFB3A7', M: '#D9665F' }
  const hidden = hiddenSlots(eq)
  for (const k of ORDER) {
    if (k === 'base') { apply(g, BASE.m, glob, true); continue }
    if (k === 'hb') {
      const p = PART[eq.h]
      if (p) { const pal = { ...glob, ...p.pal }; apply(g, p.back, pal, true); apply(g, p.ob, pal, false) }
      continue
    }
    if (hidden.has(k)) continue
    const p = PART[eq[k]]
    if (!p) continue
    const pal = { ...glob, ...p.pal }
    if (k === 'w') { apply(g, p.back, pal, true, false, p.off); continue }
    apply(g, p.m, pal, true, false, p.off)
    apply(g, p.o, pal, false, false, p.off)
  }
  roundShoulders(g)
  armSeam(g)
  return g
}

// ขอบ: ช่องว่างที่ห่างจากพิกเซลตัวละคร ≤1.5 = ขอบเข้ม · ≤3.2 = ขอบขาว (ระยะแบบ euclidean)
function outline(g) {
  const w = W + PAD * 2, h = H + PAD * 2
  const src = Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => g[y - PAD]?.[x - PAD] || null))
  const out = src.map(r => r.slice())
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (src[y][x]) continue
    let m = 99
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const yy = y + dy, xx = x + dx
      if (yy < 0 || xx < 0 || yy >= h || xx >= w || !src[yy][xx]) continue
      const d = Math.hypot(dx, dy); if (d < m) m = d
    }
    if (m <= 1.5) out[y][x] = INK; else if (m <= 3.2) out[y][x] = '#FFFFFF'
  }
  return { w, h, px: out }
}

const render = eq => outline(compose(eq))

;
// 🧍 ตู้เสื้อผ้าตุ๊กตา — ตรรกะล้วน (ไม่แตะ Firestore/Vue) · เทส: node --test src/utils/doll.test.js
// users/{uid}.doll = { owned: [id…], eq: { s,c,h,e,m,t,b,k,o,x,a,i,w } } (handover §6)
// แบบเดียวกับ utils/cosmetics.js: ซื้อครั้งเดียวเก็บถาวร · ใส่ได้ช่องละ 1 · ลองใส่ก่อนซื้อ · ซื้อรวดเดียวทั้งชุดที่ลอง

const SLOT_KEYS = ['s', 'c', 'h', 'e', 'm', 't', 'b', 'k', 'o', 'x', 'a', 'i', 'w']
const isColor = (k, v) => (k === 's' ? SKINS : HAIRC).some(o => o.id === v)

/** ชิ้นนี้ฟรีไหม (สีผิว/สีผมฟรีหมด) */
const isFree = (id) => FREE.has(id)

/** ของที่มี + ชุดที่ใส่ จาก user doc — กันค่าเพี้ยน/ชิ้นที่ถูกลบ/ใส่ของที่ไม่มี */
function dollOf(u) {
  const d = u?.doll || {}
  const owned = Array.isArray(d.owned) ? d.owned.filter(id => PART[id] && !isFree(id)) : []
  const has = (id) => isFree(id) || owned.includes(id)
  const raw = d.eq && typeof d.eq === 'object' ? d.eq : DEFAULT_EQ   // ยังไม่เคยแต่ง = ชุดเริ่มต้น (รวมรองเท้า)
  const eq = {}
  for (const k of SLOT_KEYS) {
    const v = raw[k]
    if (k === 's' || k === 'c') { eq[k] = isColor(k, v) ? v : DEFAULT_EQ[k]; continue }
    if (v && PART[v]?.slot === k && has(v)) eq[k] = v
    else if (REQUIRED.includes(k)) eq[k] = DEFAULT_EQ[k]
  }
  return { owned, eq }
}

/** ลองใส่ชิ้น id ในช่อง slot (id = null ถอด) · คืน eq ใหม่ — ไม่สนว่ามีของไหม (ลองได้ทุกชิ้น)
 *  กติกาชุดเต็มตัว (handover §4): เลือกท่อนล่างขณะใส่ชุดเต็มตัว = ถอดชุดกลับเป็นเสื้อเริ่มต้น */
function tryOn(eq, slot, id) {
  const next = { ...eq }
  if (!id) {
    if (REQUIRED.includes(slot)) return next
    delete next[slot]; return next
  }
  next[slot] = id
  if (slot === 'b' && PART[eq.t]?.full) next.t = DEFAULT_EQ.t
  return next
}

/** ชิ้นที่ต้องซื้อถ้าจะใส่ชุดนี้ → { items: [part…], total } (ไม่นับช่องที่ถูกชุดเต็มตัวบัง) */
function cartFor(u, eq) {
  const { owned } = dollOf(u)
  const covered = new Set()
  for (const id of Object.values(eq)) { const p = PART[id]; if (p?.full) covered.add('b'); for (const c of p?.covers || []) covered.add(c) }
  const items = []
  for (const [k, id] of Object.entries(eq)) {
    if (k === 's' || k === 'c' || covered.has(k)) continue
    const p = PART[id]
    if (p && !isFree(id) && !owned.includes(id)) items.push(p)
  }
  return { items, total: items.reduce((a, p) => a + p.price, 0) }
}

/** ซื้อทั้งชุดได้ไหม → { ok, reason: 'none'|'coins'|null, total } */
function canBuyCart(u, eq) {
  const { items, total } = cartFor(u, eq)
  if (!items.length) return { ok: false, reason: 'none', total: 0 }
  if ((u?.coins || 0) < total) return { ok: false, reason: 'coins', total }
  return { ok: true, reason: null, total }
}

/** ค่า doll ใหม่หลังซื้อทั้งชุด (ใส่ให้ทันที) */
function afterBuyCart(u, eq) {
  const cur = dollOf(u)
  const { items } = cartFor(u, eq)
  const owned = [...cur.owned, ...items.map(p => p.id).filter(id => !cur.owned.includes(id))]
  return dollOf({ doll: { owned, eq } })
}

/** ใส่ชุดที่ลอง (เฉพาะเมื่อมีครบทุกชิ้นแล้ว) — ไม่ครบ = คืนของเดิม */
function afterEquip(u, eq) {
  if (cartFor(u, eq).items.length) return dollOf(u)
  return dollOf({ doll: { owned: dollOf(u).owned, eq } })
}

/** ชุดที่ลองต่างจากที่ใส่อยู่ไหม */
function sameEq(a, b) {
  const keys = new Set([...Object.keys(a), ...Object.keys(b)])
  for (const k of keys) if ((a[k] || null) !== (b[k] || null)) return false
  return true
}


// ── จำลอง user doc ──
const user = { coins: 500000, doll: null }
const TABS = [{ k: 's', label: 'สีผิว' }, { k: 'c', label: 'สีผม' }, ...SLOTS]
let tab = 'h'
let trying = { ...dollOf(user).eq }
const $ = (id) => document.getElementById(id)

function paint(cv, eq, s) {
  const r = render(eq)
  cv.width = r.w * s; cv.height = r.h * s
  cv.style.imageRendering = 'pixelated'
  const ctx = cv.getContext('2d')
  for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
    const v = r.px[y][x]; if (!v) continue
    ctx.fillStyle = v; ctx.fillRect(x * s, y * s, s, s)
  }
}
const fmt = (n) => n >= 1e6 ? `${(n / 1e6).toLocaleString(undefined, { maximumFractionDigits: 1 })}M` : `${n / 1000}k`
const has = (id) => isFree(id) || dollOf(user).owned.includes(id)
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800) }
function ask(text) { return new Promise(res => { $('ask').textContent = text; $('sheet').hidden = false; $('yes').onclick = () => { $('sheet').hidden = true; res(true) }; $('no').onclick = () => { $('sheet').hidden = true; res(false) } }) }

function draw() {
  const mine = dollOf(user)
  $('coins').textContent = user.coins.toLocaleString()
  paint($('main'), trying, 5)
  const changed = !sameEq(trying, mine.eq)
  const cart = cartFor(user, trying)
  $('note').textContent = changed ? (cart.items.length ? `กำลังลอง · ต้องซื้อ ${cart.items.length} ชิ้น` : 'กำลังลอง · มีครบแล้ว') : 'ที่ใส่อยู่ตอนนี้'
  const cov = (k) => k === 'b' && !!PART[trying.t]?.full
  $('tabs').innerHTML = TABS.map(t => `<button class="tab ${tab === t.k ? 'on' : ''} ${cov(t.k) ? 'cov' : ''}" role="tab" aria-selected="${tab === t.k}" data-k="${t.k}" type="button">${t.label}</button>`).join('')
  $('hint').hidden = !cov(tab)
  const body = $('body')
  if (tab === 's' || tab === 'c') {
    const list = tab === 's' ? SKINS : HAIRC
    body.innerHTML = `<div class="colors">${list.map(o => `<button class="color ${trying[tab] === o.id ? 'sel' : ''}" style="background:${tab === 's' ? o.S : o.H}" data-p="${o.id}" type="button"><span>${o.label}</span></button>`).join('')}</div>`
  } else {
    const parts = PARTS.filter(p => p.slot === tab)
    body.innerHTML = `<div class="grid">${REQUIRED.includes(tab) ? '' : `<button class="item ${!trying[tab] ? 'sel' : ''}" data-p="" type="button"><span class="none">ไม่ใส่</span></button>`}${parts.map(p => `<button class="item ${trying[tab] === p.id ? 'sel' : ''}" data-p="${p.id}" type="button"><canvas data-c="${p.id}"></canvas><span class="nm">${p.label}</span>${mine.eq[tab] === p.id ? '<span class="st on">ใส่อยู่</span>' : has(p.id) ? '<span class="st">มีแล้ว</span>' : `<span class="price">🪙 ${fmt(p.price)}</span>`}</button>`).join('')}</div>`
    body.querySelectorAll('canvas[data-c]').forEach(cv => paint(cv, tryOn(trying, tab, cv.dataset.c), 2))
  }
  $('dock').hidden = !changed
  const buy = canBuyCart(user, trying)
  const act = $('act')
  if (cart.items.length) {
    act.textContent = buy.reason === 'coins' ? `เหรียญไม่พอ (ขาด ${(cart.total - user.coins).toLocaleString()})` : `ซื้อ ${cart.items.length} ชิ้นแล้วใส่ · 🪙 ${cart.total.toLocaleString()}`
    act.disabled = !buy.ok
  } else { act.textContent = 'ใส่ชุดนี้'; act.disabled = false }
}

$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { tab = b.dataset.k; draw() } })
$('body').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) { trying = tryOn(trying, tab, b.dataset.p || null); draw() } })
$('reset').onclick = () => { trying = { ...dollOf(user).eq }; draw() }
$('refill').onclick = () => { user.coins += 1000000; draw() }
$('act').onclick = async () => {
  const eq = { ...trying }
  const { items, total } = cartFor(user, eq)
  if (items.length) {
    if (!canBuyCart(user, eq).ok) return
    if (!await ask(`ซื้อ ${items.length} ชิ้น (${items.map(p => p.label).join(', ')}) ราคารวม ${total.toLocaleString()} เหรียญ?\nซื้อแล้วเก็บถาวร ใส่/ถอดได้ตลอด`)) return
    user.doll = afterBuyCart(user, eq); user.coins -= total
    toast(`ได้ ${items.length} ชิ้นแล้ว ใส่ให้เลย`)
  } else { user.doll = afterEquip(user, eq); toast('ใส่ชุดนี้แล้ว') }
  trying = { ...dollOf(user).eq }; draw()
}
draw()
